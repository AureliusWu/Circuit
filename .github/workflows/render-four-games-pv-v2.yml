name: Render Four Games PV v2 Voice Cut

on:
  push:
    branches:
      - 'pv/remotion-voice-v2-20261022'
    paths:
      - 'pv-remotion/**'
      - '.github/workflows/render-four-games-pv-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Remotion dependencies
        working-directory: pv-remotion
        run: npm install --no-audit --no-fund

      - name: Fetch source game assets and voices
        working-directory: pv-remotion
        run: npm run fetch-assets

      - name: Render 2-minute voice-cut PV
        working-directory: pv-remotion
        run: npm run render

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: four-games-pv-v2-voice-1080p
          path: pv-remotion/out/four-games-pv.mp4
          if-no-files-found: error
          retention-days: 14
