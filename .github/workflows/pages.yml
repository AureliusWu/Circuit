name: Deploy playable game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test bounded Service Worker activation wait
        run: python3 -m unittest discover -s tests -p 'test_pwa_activation.py' -v
      - name: Build for the repository URL
        run: npm run build
        env:
          CIRCUIT_BASE_PATH: /Circuit/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild expected published bytes
        run: npm run build
        env:
          CIRCUIT_BASE_PATH: /Circuit/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the public game at desktop, portrait and landscape sizes
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/live-browser.py "${{ steps.deployment.outputs.page_url }}" --expected-build dist --output artifacts/pages-live/live-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-pages-live
          path: artifacts/pages-live/
          if-no-files-found: error
