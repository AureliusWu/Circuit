name: Render Four Games PV v2 Voice Cut Fast

on:
  push:
    branches:
      - 'pv/remotion-voice-v2-20261022'
    paths:
      - 'pv-remotion/**'
      - '.github/workflows/render-four-games-pv-v2b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install Remotion dependencies
        working-directory: pv-remotion
        run: npm install --no-audit --no-fund
      - name: Fetch assets and voices concurrently
        working-directory: pv-remotion
        run: npm run fetch-assets
      - name: Render voice-cut PV v2
        working-directory: pv-remotion
        run: npm run render
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: four-games-pv-v2-voice-1080p-fast
          path: pv-remotion/out/four-games-pv.mp4
          if-no-files-found: error
          retention-days: 14
