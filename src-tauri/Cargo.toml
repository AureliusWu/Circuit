[package]
name = "circuit"
version = "1.2.0"
description = "回路 / Circuit - Chinese folk horror narrative game"
authors = ["AureliusWu"]
edition = "2021"

[lib]
name = "circuit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
