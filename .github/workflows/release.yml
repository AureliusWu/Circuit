name: Build release artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web / PWA archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify complete production media
        run: |
          python -m pip install Pillow
          python tools/production/validate_runtime.py --require-complete
      - run: npm test
      - run: npm run build
      - name: Browser campaign and offline regression
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          export CIRCUIT_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/circuit-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then break; fi
            sleep 1
          done
          python tests/release-browser.py http://127.0.0.1:4173 --pwa
          python tests/reading-browser.py http://127.0.0.1:4173
          python tests/tickets-browser.py http://127.0.0.1:4173
      - run: node scripts/package-web.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: circuit-web
          path: artifacts/circuit-web-*
          if-no-files-found: error

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Build with locked Rust dependencies
        run: npm run tauri build -- --bundles nsis -- --locked
      - name: Install and exercise the actual Windows application
        shell: pwsh
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'Circuit-release-install'
          $installed = Start-Process $installer[0].FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          $application = @(Get-ChildItem $installRoot -Filter circuit.exe -Recurse)
          if ($application.Count -ne 1) { throw 'Installed executable missing or ambiguous' }
          python tests/desktop-smoke.py --exe $application[0].FullName --output artifacts/windows-runtime/windows-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = @(Get-ChildItem $installRoot -Filter '*uninstall*.exe')
          if ($uninstaller.Count -ne 1) { throw 'Uninstaller missing or ambiguous' }
          $removed = Start-Process $uninstaller[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstaller failed: $($removed.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $application[0].FullName) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $application[0].FullName) { throw 'Uninstall left the application executable' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-windows-runtime
          path: artifacts/windows-runtime/
          if-no-files-found: error
      - name: Installer checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one verified NSIS installer' }
          # GitHub cleans Unicode and spaces from release asset names. Name the
          # original artifact exactly as it will be downloaded before hashing.
          $canonicalName = "Circuit_${version}_x64-setup.exe"
          $canonicalPath = Join-Path $installer[0].DirectoryName $canonicalName
          if ($installer[0].Name -cne $canonicalName) {
            Rename-Item -LiteralPath $installer[0].FullName -NewName $canonicalName
          }
          $checksum = (Get-FileHash -LiteralPath $canonicalPath -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$canonicalPath.sha256", "$checksum  $canonicalName`n", [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: circuit-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  publish:
    name: Publish verified immutable version
    needs: [web, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: circuit-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: circuit-web
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: circuit-windows-nsis
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: circuit-windows-runtime
          path: runtime-evidence
      - name: Verify all draft bytes before public publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          decision=$(node scripts/release-preflight.mjs)
          if [ "$decision" != publish ]; then
            echo "No publication needed: $decision. Verified artifacts remain available."
            exit 0
          fi
          cp runtime-evidence/windows-runtime.json release-assets/windows-runtime.json
          node --input-type=module -e 'import fs from "node:fs"; const runtime=JSON.parse(fs.readFileSync("release-assets/windows-runtime.json")); if(runtime.status!=="passed"||runtime.commit!==process.env.GITHUB_SHA) throw Error("Native evidence mismatch"); fs.writeFileSync("release-assets/release.json",JSON.stringify({version:runtime.version,commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,nativeChecks:runtime.checks},null,2)+"\n");'
          node scripts/publish-release.mjs release-assets
