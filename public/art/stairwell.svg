<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="stairwell-title stairwell-desc">
<title id="stairwell-title">居民楼 · 二层楼道</title><desc id="stairwell-desc">老式居民楼的水泥楼梯向上折入光线昏黄的平台。漆面剥落的扶手、旧电表、外露穿线管和没有灯光的房门保留着日常生活的痕迹。</desc>
<metadata>为《回路》原创绘制的项目美术素材。无外部图像、字体或企业标识。</metadata>
