<linearGradient id="stairwell-ground" x2=".2" y2="1"><stop stop-color="#4c5650"/><stop offset=".43" stop-color="#353f3d"/><stop offset="1" stop-color="#192423"/></linearGradient>
<linearGradient id="stairwell-metal" x2="1" y2=".2"><stop stop-color="#7c8980"/><stop offset=".2" stop-color="#586760"/><stop offset=".78" stop-color="#49574f"/><stop offset="1" stop-color="#788078"/></linearGradient>
<radialGradient id="stairwell-lamp"><stop stop-color="#e1d5a0" stop-opacity=".48"/><stop offset=".25" stop-color="#c8be8e" stop-opacity=".19"/><stop offset="1" stop-color="#a6ad90" stop-opacity="0"/></radialGradient>
