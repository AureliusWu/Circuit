name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web / PWA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Full source and bundled audio verification
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python tools/audio/validate_media.py
      - run: npm run build
      - name: Campaign, reading, saves, voice and offline regression
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          export CIRCUIT_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/circuit-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then break; fi
            sleep 1
          done
          python tests/release-browser.py http://127.0.0.1:4173 --pwa
          python tests/reading-browser.py http://127.0.0.1:4173
          python tests/voice-browser.py http://127.0.0.1:4173
          python tests/answering-browser.py http://127.0.0.1:4173
          python tests/history-search-browser.py http://127.0.0.1:4173

  desktop:
    name: Windows desktop compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --no-bundle -- --locked
